# Triggers the "due tomorrow" push reminder job on the deployed API once an hour.
# The job itself decides who is due (each phone gets one reminder per day, at or after
# REMINDER_HOUR on its own clock), so running it hourly — or twice — is safe.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   API_URL      e.g. https://pms-api.onrender.com   (no trailing slash)
#   CRON_SECRET  the same value as the API's CRON_SECRET environment variable
name: Due-tomorrow reminders

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder job
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL / CRON_SECRET secrets are not set — skipping."
            exit 0
          fi
          # A free Render instance may be asleep; --retry waits for it to wake up.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --max-time 120 \
            -X POST "$API_URL/api/internal/reminders/run" \
            -H "Authorization: Bearer $CRON_SECRET"
